name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths: ["src/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            artifact: clx-linux-x86_64
            binary: clx
            exe_ext: ""
            format: tar.gz
          - name: windows-x86_64
            os: windows-latest
            artifact: clx-windows-x86_64
            binary: clx.exe
            exe_ext: ".exe"
            format: zip
          - name: macos-arm64
            os: macos-latest
            artifact: clx-macos-arm64
            binary: clx
            exe_ext: ""
            format: tar.gz


    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build ${{ matrix.os == 'windows-latest' && '' || '-DCMAKE_BUILD_TYPE=Release' }}

      - name: Build
        run: cmake --build build --config Release

      - name: Archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          FOLDER=${{ matrix.artifact }}
          mkdir -p staging/$FOLDER/bin staging/$FOLDER/include staging/$FOLDER/lib
          cp -f build/${{ matrix.binary }} staging/$FOLDER/bin/
          cp -f include/clx.h include/clx_runtime.h include/clx_simd.h staging/$FOLDER/include/
          cp -f build/libclx.a build/libclx_size.a staging/$FOLDER/lib/
          cp -f build/clx_lua/libclx_lua.a staging/$FOLDER/lib/ 2>/dev/null || true
          tar czf $FOLDER.tar.gz -C staging $FOLDER

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $FOLDER = "${{ matrix.artifact }}"
          New-Item -ItemType Directory -Path "staging/$FOLDER/bin","staging/$FOLDER/include","staging/$FOLDER/lib" -Force | Out-Null
          Copy-Item "bin/${{ matrix.binary }}" "staging/$FOLDER/bin/"
          Copy-Item "include/clx.h","include/clx_runtime.h","include/clx_simd.h" "staging/$FOLDER/include/"
          Copy-Item "lib/clx.lib" "staging/$FOLDER/lib/"
          Copy-Item "lib/clx_size.lib" "staging/$FOLDER/lib/"
          if (Test-Path "lib/clx_lua.lib") { Copy-Item "lib/clx_lua.lib" "staging/$FOLDER/lib/" }
          Compress-Archive -Path "staging/$FOLDER" -DestinationPath "$FOLDER.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.format }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
          generate_release_notes: true
